name: ci

# Full CI coverage: shellcheck + test suite. Secret scanning is covered by
# secrets-scan.yml (betterleaks). Uses a git-capable base image (the dedicated
# shellcheck image lacks git, so checkout fails) and installs shellcheck inline.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  shellcheck:
    runs-on: docker
    container:
      image: node:20-bookworm
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
      - name: shellcheck
        run: |
          apt-get update -qq && apt-get install -y -qq shellcheck >/dev/null
          find . -name "*.sh" -exec shellcheck -s sh -S warning -e SC2154,SC3043,SC2034 {} +

  test:
    runs-on: docker
    container:
      image: node:20-bookworm
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
      - name: unit tests (GNU awk)
        # Integration tests auto-skip off-router; unit tests cover the logic.
        run: sh test.sh

      - name: unit tests (BusyBox awk)
        # The router runs BusyBox. Its awk differs from GNU awk in ways that
        # have already caused a silent failure on-device while CI stayed green,
        # so the suite runs against both.
        run: |
          apt-get update -qq && apt-get install -y -qq busybox >/dev/null
          AWK="busybox awk" sh test.sh
