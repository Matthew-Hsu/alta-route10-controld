name: ci

# Full CI coverage: shellcheck + test suite + gitleaks. Secret scanning is
# additionally covered by secrets-scan.yml (betterleaks).
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  shellcheck:
    runs-on: docker
    container:
      image: koalaman/shellcheck:stable
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
      - name: shellcheck (all scripts)
        run: find . -name "*.sh" -exec shellcheck -s sh -S warning -e SC2154,SC3043,SC2034 {} +

  test:
    runs-on: docker
    container:
      image: koalaman/shellcheck:stable
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
      - name: unit test suite
        # Integration tests auto-skip off-router; unit tests cover the logic.
        run: sh test.sh

  gitleaks:
    runs-on: docker
    container:
      image: zricethezav/gitleaks:latest
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
      - name: secret scan
        run: gitleaks detect --source . --verbose
