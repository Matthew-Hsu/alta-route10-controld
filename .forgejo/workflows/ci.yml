name: ci

# Full CI coverage: shellcheck + test suite. Secret scanning is covered by
# secrets-scan.yml (betterleaks). Uses a git-capable base image (the dedicated
# shellcheck image lacks git, so checkout fails) and installs shellcheck inline.
#
# pull_request carries no branches filter on purpose. With [master] on it, a PR
# based on another branch was not merely unchecked — no check ever appeared, so
# the page showed nothing pending and nothing failed. A stack reviewed that way
# is reviewed without CI, and retargeting one to master afterwards does not fire
# it either: that is a pull_request "edited" event, which is outside the default
# activity types. Two PRs in a release stack were merged off the back of local
# runs alone before this was noticed.
on:
  push:
    branches: [master]
  pull_request:

jobs:
  shellcheck:
    runs-on: docker
    container:
      image: node:20-bookworm
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
      - name: shellcheck
        run: |
          apt-get update -qq && apt-get install -y -qq shellcheck >/dev/null
          find . -name "*.sh" -exec shellcheck -s sh -S warning -e SC2154,SC3043,SC2034 {} +
          # -S warning never reports SC2086, so the disable directives guarding
          # deliberate word-splitting are invisible to it. Check that one code
          # on its own; see .github/workflows/ci.yml for why not -S info.
          find . -name "*.sh" -exec shellcheck -s sh -S info -i SC2086 {} +

  test:
    runs-on: docker
    container:
      image: node:20-bookworm
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
      - name: unit tests (GNU awk)
        # Integration tests auto-skip off-router; unit tests cover the logic.
        run: sh test.sh

      - name: unit tests (BusyBox awk)
        # The router runs BusyBox. Its awk differs from GNU awk in ways that
        # have already caused a silent failure on-device while CI stayed green,
        # so the suite runs against both.
        run: |
          apt-get update -qq && apt-get install -y -qq busybox >/dev/null
          AWK="busybox awk" sh test.sh

      - name: unit tests (BusyBox ash)
        # The runs above use the container's /bin/sh, which is dash. The router
        # runs BusyBox ash and the two disagree; see .github/workflows/ci.yml
        # for the assertion that tested one thing here and another on-device.
        run: AWK="busybox awk" busybox sh test.sh
