name: secrets-scan

# pull_request carries no branches filter on purpose. With [master] on it, a PR
# based on another branch was not merely unchecked — no check ever appeared, so
# the page showed nothing pending and nothing failed. A stack reviewed that way
# is reviewed without CI, and retargeting one to master afterwards does not fire
# it either: that is a pull_request "edited" event, which is outside the default
# activity types. Two PRs in a release stack were merged off the back of local
# runs alone before this was noticed.
on:
  push:
    branches: [master]
  pull_request:

jobs:
  scan:
    runs-on: docker
    container:
      image: node:20-bookworm
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4

      - name: Install and scan
        run: |
          curl -sL https://github.com/betterleaks/betterleaks/releases/download/v1.1.2/betterleaks_1.1.2_linux_x64.tar.gz | tar xz -C /usr/local/bin
          betterleaks dir . --exit-code 1 --redact
