# blank_issues_enabled: false sends every issue through one of the two
# templates. The point of bug_report.yml is that what's pasted in is enough on
# its own to reproduce the problem. A blank issue can't be required to include
# any of that, so leaving it enabled would give every reporter a way around
# asking for it. question_or_feature.md is free text as well, but it sends a
# bug back to the form.
blank_issues_enabled: false
contact_links:
  - name: Report a security vulnerability
    url: https://github.com/Matthew-Hsu/alta-route10-controld/security/advisories/new
    about: >-
      A way to bypass, disable, or spoof DNS routing, or any other security
      issue. Do not open a public issue for this. See SECURITY.md.
