name: ci

# Mirrors .forgejo/workflows/ci.yml, which GitHub does not read. This fork is
# the canonical home, so the checks have to run here. secrets-scan mirrors
# .forgejo/workflows/secrets-scan.yml for the same reason.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: betterleaks
        run: |
          curl -sL https://github.com/betterleaks/betterleaks/releases/download/v1.1.2/betterleaks_1.1.2_linux_x64.tar.gz | sudo tar xz -C /usr/local/bin
          betterleaks dir . --exit-code 1 --redact

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          find . -name "*.sh" -exec shellcheck -s sh -S warning -e SC2154,SC3043,SC2034 {} +

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: unit tests (GNU awk)
        # Integration tests auto-skip off-router; unit tests cover the logic.
        run: sh test.sh

      - name: unit tests (BusyBox awk)
        # The router runs BusyBox. Its awk differs from GNU awk in ways that
        # have already caused a silent failure on-device while CI stayed green,
        # so the suite runs against both.
        run: |
          sudo apt-get install -y -qq busybox
          AWK="busybox awk" sh test.sh
